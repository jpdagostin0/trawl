{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{{block "title" .}}trawl{{end}}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="search" type="application/opensearchdescription+xml" title="trawl" href="/opensearch.xml">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body class="{{if .Home}}home{{end}}{{if .Reader}}reader-page{{end}}">
{{block "body" .}}{{end}}
</body>
</html>{{end}}

{{define "searchbox"}}
<form class="searchbox" action="/search" method="get" role="search" autocomplete="off">
  <input id="q" name="q" type="search" value="{{.Q}}" placeholder="Search the web, or paste a URL to read it" aria-label="Search" {{if not .Q}}autofocus{{end}}>
  {{if and .Cat (ne .Cat "general")}}<input type="hidden" name="c" value="{{.Cat}}">{{end}}
  <button type="submit" aria-label="Search"><svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <ul id="suggest" class="suggest" hidden></ul>
</form>
{{end}}
