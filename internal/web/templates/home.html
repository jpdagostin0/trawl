  <p class="tag">Many engines, no ads, no tracking. Every page readable.</p>
  {{template "searchbox" .}}

    <span><kbd>/</kbd> focus</span>
    <span><kbd>!g</kbd> <kbd>!w</kbd> <kbd>!gh</kbd> bangs</span>

{{end}}
